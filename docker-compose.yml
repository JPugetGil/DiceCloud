services:
  dicecloud-db:
    container_name: dicecloud-db
    image: mongo:latest
    command:
      - --storageEngine=wiredTiger
    volumes:
      - ./dicecloud/data/db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=meteor
      - MONGO_INITDB_ROOT_PASSWORD=meteor
  dicecloud:
    container_name: dicecloud
    build:
      context: ./
    environment:
      # Update ROOT_URL and PORT for your environment
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://meteor:meteor@dicecloud-db:27017
      - PORT=3000
      - NODE_ENV=production
      # Settings as JSON (Google sign-in, S3, legal notices): see the README
      - METEOR_SETTINGS={}
      # SMTP server for password reset and email verification messages. Without
      # it, Meteor prints those emails in the server log instead of sending them
      # - MAIL_URL=smtps://<user>:<password>@<smtp server>:465
      # Library collections and libraries a new account is subscribed to, so
      # that it can build a character at once (comma-separated ids)
      # - DEFAULT_LIBRARY_COLLECTIONS=<id>,<id>
      # - DEFAULT_LIBRARIES=<id>
    ports:
      - '3000:3000' #The internal port should match the port set in the environmental variables
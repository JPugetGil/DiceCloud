# Lint, unit tests and type check of the app, on every push and pull request.
# The browser checks of tests/e2e need a running app with data: run them
# locally (see tests/e2e/README.md).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Cache Meteor
        uses: actions/cache@v6.1.0
        with:
          path: ~/.meteor
          key: meteor-${{ runner.os }}-${{ hashFiles('app/.meteor/release', 'app/.meteor/versions') }}

      - name: Install Meteor
        run: |
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl -fsSL "https://install.meteor.com/?release=$(sed 's/^METEOR@//' .meteor/release)" | sh
          fi
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Cache npm
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'tests/cycles/package-lock.json') }}

      - name: Install npm packages
        run: meteor npm ci

      # Production dependencies only, high and critical advisories only. The
      # development tools never reach the server nor the browser (the
      # Dockerfile prunes the bundle's npm packages), and a moderate advisory
      # can be out of reach: pbkdf2 3.1.3 (moderate, a browser polyfill no
      # client code loads) is bundled inside meteor-node-stubs 1.2.30, where
      # npm cannot replace it; 1.2.31 (19 October 2026) bundles 3.1.7, fixed,
      # and is two weeks old on 2 November. Run `meteor npm audit` locally for
      # the full list
      - name: Audit production dependencies
        run: meteor npm audit --omit=dev --audit-level=high

      - name: Lint
        run: meteor npm run lint

      # madge has its own package: its TypeScript peer is not the app's
      - name: Import cycles (no new cycle)
        run: |
          meteor npm ci --prefix ../tests/cycles
          meteor npm run cycles

      # The production scripts: their syntax, and the backups and restores
      # against stubs of Docker (tests/deploy)
      - name: Deploy scripts
        working-directory: .
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          bash tests/deploy/dicecloud.test.sh

      # The Vue components, rendered in happy-dom with the app's Vuetify and
      # translations (app/tests/components)
      - name: Component tests
        run: meteor npm run test:components

      # Client tests would need a browser driver: the tests that matter run on
      # the server. They include the properties (*.property.test.ts, fast-check)
      - name: Unit tests
        run: meteor npm test
        env:
          TEST_CLIENT: 0
          # Mocha's 2 s per test is short for the database work some do on a
          # busy runner
          MOCHA_TIMEOUT: 10000

      # After the tests: building the app writes the Meteor packages' types
      - name: Type check (no new errors)
        run: meteor npm run typecheck
